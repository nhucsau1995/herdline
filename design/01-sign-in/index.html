<style>

      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;

      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

<body class="bg-[#e9ecf2] min-h-screen flex items-center justify-center p-0 sm:p-4 select-none antialiased font-body">
<!-- Mobile Frame: 393px by 852px -->
<main class="w-full max-w-[393px] h-[852px] bg-background flex flex-col justify-between overflow-hidden sm:rounded-[44px] shadow-2xl relative border border-border/60">
<!-- Top Area: Status Bar & Integrated Hero -->
<header class="w-full flex-shrink-0 relative">
<!-- iOS Status Bar Area -->
<div class="w-full h-11 px-7 flex items-center justify-between z-30 absolute top-0 left-0 text-white font-label font-semibold text-[14px]">
<span>9:41</span>
<div class="flex items-center space-x-1.5 opacity-95">
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[20px] leading-none">battery_full</span>
</div>
</div>
<!-- Real Barn Photograph Header -->
<div class="relative w-full h-[156px] overflow-hidden bg-text-primary">
<img alt="Herdline Modern Dairy Barn Facility" class="w-full h-full object-cover object-center brightness-[0.88] contrast-[1.05]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_KXXbDytNNm796OGyRTcNU3rKboSnF9Ua2FTTHOIQXNyIqXOXRR4jkEa7CuFKos70kjTuOGmtupQhv5BrqHYUQ9D7ulljaF8BbM22xyROI2sxoG1o4gATRuFkxA-zwmDLuf4uSpVCfS6RW6HmUslDGfyGF1sDYf8q3hiGg8skvflvR0lGmEMXRcF438aZmM0CioFwwXtshSLkxT6hyQ7me4B5qzYh9xAHfrsb3cMMtCEaE2Zzr9_Nz_rCyH2076E7sJ83jrtdwgSIFA"/>
<!-- Soft ambient blend gradient -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-[#1B65DA]/90"></div>
</div>
<!-- Gradient Brand Bar -->
<div class="bg-gradient-to-r from-accentFill to-accentPressed px-5 pt-3.5 pb-4 text-white shadow-sm">
<div class="flex items-center justify-between mb-0.5">
<h1 class="font-title text-[32px] leading-9 font-bold tracking-tight text-white drop-shadow-sm">Herdline</h1>
<div class="flex items-center gap-1.5 bg-white/15 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/20">
<span class="material-symbols-outlined text-[15px] text-white">cloud_off</span>
<span class="font-label text-[12px] font-medium text-white tracking-wide">Offline mode</span>
</div>
</div>
<p class="font-body text-[14px] leading-5 text-white/90">Herd records that work without signal</p>
</div>
</header>
<!-- Scrollable Form Container -->
<div class="flex-1 px-5 pt-3.5 pb-1 flex flex-col justify-between overflow-y-auto no-scrollbar">
<!-- Role Selection Section -->
<section class="flex flex-col">
<div class="flex items-center justify-between mb-2">
<span class="font-label text-[13px] font-semibold uppercase tracking-wider text-text-secondary">Choose your role</span>
<span class="font-label text-[12px] text-text-tertiary">1 of 4 selected</span>
</div>
<!-- 2x2 Grid of Role Cards -->
<div class="grid grid-cols-2 gap-2.5">
<!-- 1. Admin -->
<button class="w-full text-left bg-surface rounded-[20px] p-3.5 shadow-herdline border border-border hover:border-accent/40 active:scale-[0.98] transition-all duration-150 flex flex-col justify-between min-h-[104px]" type="button">
<div class="flex items-center justify-between w-full">
<div class="w-8 h-8 rounded-full bg-accentTint/60 flex items-center justify-center">
<span class="material-symbols-outlined text-accentFill text-[20px]">shield</span>
</div>
</div>
<div>
<h2 class="font-title text-[15px] leading-tight font-semibold text-text-primary mb-0.5">Admin</h2>
<p class="font-body text-[12px] leading-[15px] text-text-secondary">Full access, team and settings</p>
</div>
</button>
<!-- 2. Manager (SELECTED STATE) -->
<button class="w-full text-left bg-accentTint rounded-[20px] p-3.5 shadow-selected border-2 border-accent active:scale-[0.98] transition-all duration-150 flex flex-col justify-between min-h-[104px] relative" type="button">
<div class="flex items-center justify-between w-full">
<div class="w-8 h-8 rounded-full bg-accentFill text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-[20px]">business_center</span>
</div>
<div class="w-5 h-5 rounded-full bg-accentFill text-white flex items-center justify-center shadow-xs">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
</div>
<div>
<h2 class="font-title text-[15px] leading-tight font-semibold text-text-primary mb-0.5">Manager</h2>
<p class="font-body text-[12px] leading-[15px] text-text-secondary">Herd, milk, breeding, reports</p>
</div>
</button>
<!-- 3. Worker -->
<button class="w-full text-left bg-surface rounded-[20px] p-3.5 shadow-herdline border border-border hover:border-accent/40 active:scale-[0.98] transition-all duration-150 flex flex-col justify-between min-h-[104px]" type="button">
<div class="flex items-center justify-between w-full">
<div class="w-8 h-8 rounded-full bg-accentTint/60 flex items-center justify-center">
<span class="material-symbols-outlined text-accentFill text-[20px]">assignment</span>
</div>
</div>
<div>
<h2 class="font-title text-[15px] leading-tight font-semibold text-text-primary mb-0.5">Worker</h2>
<p class="font-body text-[12px] leading-[15px] text-text-secondary">Daily milk and animal records</p>
</div>
</button>
<!-- 4. Veterinarian -->
<button class="w-full text-left bg-surface rounded-[20px] p-3.5 shadow-herdline border border-border hover:border-accent/40 active:scale-[0.98] transition-all duration-150 flex flex-col justify-between min-h-[104px]" type="button">
<div class="flex items-center justify-between w-full">
<div class="w-8 h-8 rounded-full bg-accentTint/60 flex items-center justify-center">
<span class="material-symbols-outlined text-accentFill text-[20px]">stethoscope</span>
</div>
</div>
<div>
<h2 class="font-title text-[15px] leading-tight font-semibold text-text-primary mb-0.5">Veterinarian</h2>
<p class="font-body text-[12px] leading-[15px] text-text-secondary">Health and breeding records</p>
</div>
</button>
</div>
</section>
<!-- Device PIN Section -->
<section class="bg-surface rounded-[20px] p-4 shadow-herdline border border-border mt-3 flex flex-col items-center">
<div class="w-full flex items-center justify-between mb-3">
<label class="font-label text-[13px] font-semibold text-text-secondary">Device PIN</label>
<span class="font-caption text-[12px] text-accentFill font-medium">Reset PIN</span>
</div>
<!-- 4-digit PIN Entry Row -->
<div class="flex items-center justify-center gap-3.5 mb-2.5">
<!-- Box 1: Filled -->
<div class="w-13 h-13 w-[52px] h-[52px] rounded-xl bg-surface border-[1.5px] border-borderStrong flex items-center justify-center shadow-xs">
<div class="w-3.5 h-3.5 rounded-full bg-accentFill"></div>
</div>
<!-- Box 2: Filled -->
<div class="w-[52px] h-[52px] rounded-xl bg-surface border-[1.5px] border-borderStrong flex items-center justify-center shadow-xs">
<div class="w-3.5 h-3.5 rounded-full bg-accentFill"></div>
</div>
<!-- Box 3: Active State with cursor -->
<div class="w-[52px] h-[52px] rounded-xl bg-white border-2 border-accent flex items-center justify-center ring-2 ring-accent/20">
<div class="w-0.5 h-5 bg-accent animate-pulse rounded-full"></div>
</div>
<!-- Box 4: Empty -->
<div class="w-[52px] h-[52px] rounded-xl bg-surface border-[1.5px] border-borderStrong flex items-center justify-center shadow-xs">
<div class="w-2.5 h-2.5 rounded-full bg-border"></div>
</div>
</div>
<p class="font-caption text-[12px] text-text-tertiary text-center">
          Enter 4-digit PIN for quick offline access
        </p>
</section>
<!-- Primary Action Button -->
<div class="pt-3">
<button class="w-full h-[52px] rounded-full bg-accentFill hover:bg-accentPressed active:bg-accentPressed text-white font-label text-[15px] font-semibold shadow-md active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2" type="button">
<span>Sign in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Footer Area (No bottom navigation bar) -->
<footer class="w-full px-5 pt-1.5 pb-2 flex-shrink-0 flex flex-col items-center justify-center">
<!-- Offline Indicator Caption -->
<div class="flex items-center gap-1.5 text-text-tertiary mb-3">
<span class="material-symbols-outlined text-[16px] text-text-tertiary">lock</span>
<span class="font-caption text-[13px] font-medium text-text-tertiary">All data stays on this device</span>
</div>
<!-- iOS Home Bar Indicator -->
<div class="w-32 h-1 bg-text-primary/20 rounded-full mx-auto"></div>
</footer>
</main>
</body></html>
