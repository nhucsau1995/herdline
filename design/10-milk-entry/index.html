<!DOCTYPE html>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-text-primary flex justify-center items-start min-h-screen antialiased selection:bg-accentTint">
<!-- Mobile Frame Container (393px width constraint) -->
<div class="w-full max-w-[393px] min-h-[852px] bg-background relative flex flex-col pb-36 shadow-2xl">
<!-- Top App Bar (Task-Focused Navigation Shell) -->
<header class="sticky top-0 z-40 bg-surface flex items-center justify-between px-margin h-14 shadow-appbar">
<button aria-label="Close" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-text-primary hover:bg-surfaceAlt active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-title text-title text-text-primary tracking-tight">Record milk</h1>
<button aria-label="Draft info" class="w-10 h-10 -mr-2 rounded-full flex items-center justify-center text-text-tertiary hover:bg-surfaceAlt active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined">info</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin pt-space-lg flex flex-col gap-space-lg">
<!-- Animal Picker Card -->
<section class="bg-surface rounded-2xl p-space-lg shadow-card flex items-center justify-between cursor-pointer active:scale-[0.99] transition-all hover:bg-surface-bright border border-border/40">
<div class="flex items-center gap-space-md">
<div class="relative w-12 h-12 rounded-full overflow-hidden border border-border bg-surfaceAlt flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A portrait shot of a dairy Holstein Friesian cow in a rustic clean barn setting with soft natural morning window lighting, featuring sharp yellow ear tag details in a calm documentary agricultural aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFBGrF48PWDHqm6UkdPuldMiiZ-e2jercW_S9aCkFJnMVKNyoVAf5rVXG_Z2bjv88kZamGruP93hFKEbX5kMf4gjNqlRFN2CPVpIX80oMio5HDP5vQvoK62CpkJzbGILOGHdowiEDvOsnK5vKst7NuKJUet3Vq-Cm8RH4Lzx7_8rmUc3b5NRZ_bgh4QrWlHocFrdga-iTOng52Aa2uhaRI9JLoi_QtHquNQSAjm1tOJbv_ypMxK8cmqp_hvAYdfA0bmwgUv1Xv9ynEgA"/>
</div>
<div class="flex flex-col">
<span class="font-title text-[16px] leading-snug font-semibold text-text-primary">Bella · NL 0482</span>
<span class="font-label text-caption text-text-secondary">Pen 2 · Lactation 3</span>
</div>
</div>
<span class="material-symbols-outlined text-text-tertiary">chevron_right</span>
</section>
<!-- Session Selector (Segmented Control) -->
<section class="bg-surface rounded-2xl p-space-xs shadow-card flex items-center gap-1 border border-border/40">
<button class="flex-1 py-2.5 px-3 rounded-xl bg-accentFill text-on-primary font-label text-label flex items-center justify-center gap-2 shadow-sm transition-all" id="am-session" type="button">
<span class="material-symbols-outlined text-[18px] fill-icon">light_mode</span>
<span>AM Session</span>
</button>
<button class="flex-1 py-2.5 px-3 rounded-xl bg-surfaceAlt text-text-secondary hover:text-text-primary font-label text-label flex items-center justify-center gap-2 transition-all" id="pm-session" type="button">
<span class="material-symbols-outlined text-[18px]">dark_mode</span>
<span>PM Session</span>
</button>
</section>
<!-- Focal Milk Yield Input Card -->
<section class="bg-surface rounded-2xl p-space-lg shadow-card flex flex-col gap-space-md border border-border/40">
<div class="flex justify-between items-center">
<label class="font-caption text-caption font-medium text-text-secondary" for="yield-input">Milk yield</label>
<span class="font-caption text-caption text-text-tertiary font-medium">Session target: 18.0 L</span>
</div>
<div class="flex items-center justify-between py-2 px-3 rounded-xl bg-surfaceAlt ring-2 ring-accent">
<div class="flex items-baseline gap-1.5 flex-1">
<input class="font-display text-display text-text-primary bg-transparent border-0 p-0 focus:ring-0 w-32 tracking-tight" id="yield-input" type="text" value="17.8"/>
<span class="font-title text-title text-accentFill font-semibold">L</span>
</div>
<!-- Nudge Stepper Controls for fast one-handed barn entries -->
<div class="flex items-center gap-1.5">
<button class="w-10 h-10 rounded-lg bg-surface text-text-primary shadow-sm border border-border flex items-center justify-center font-title font-semibold active:scale-95 text-caption transition-all hover:bg-surface-bright" type="button">
              -0.5
            </button>
<button class="w-10 h-10 rounded-lg bg-surface text-text-primary shadow-sm border border-border flex items-center justify-center font-title font-semibold active:scale-95 text-caption transition-all hover:bg-surface-bright" type="button">
              +0.5
            </button>
</div>
</div>
<!-- Helper Context Badge -->
<div class="flex items-center gap-2 pt-1 text-text-tertiary">
<span class="w-5 h-5 rounded-full bg-success-bg flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-success-text text-[14px]">check</span>
</span>
<span class="font-caption text-caption text-text-tertiary">Typical for Bella: 15–20 L (Within expected range)</span>
</div>
</section>
<!-- Date & Time Row -->
<section class="grid grid-cols-2 gap-space-md">
<!-- Date Input -->
<div class="flex flex-col gap-1.5">
<label class="font-caption text-caption font-medium text-text-secondary">Date</label>
<div class="flex items-center gap-2 bg-surface border border-borderStrong rounded-xl px-3 py-2.5 shadow-sm focus-within:ring-2 focus-within:ring-accent">
<span class="material-symbols-outlined text-text-tertiary text-[18px]">calendar_today</span>
<input class="w-full bg-transparent border-0 p-0 font-label text-label text-text-primary focus:ring-0" readonly="" type="text" value="6 Nov 2026"/>
</div>
</div>
<!-- Time Input -->
<div class="flex flex-col gap-1.5">
<label class="font-caption text-caption font-medium text-text-secondary">Time</label>
<div class="flex items-center gap-2 bg-surface border border-borderStrong rounded-xl px-3 py-2.5 shadow-sm focus-within:ring-2 focus-within:ring-accent">
<span class="material-symbols-outlined text-text-tertiary text-[18px]">access_time</span>
<input class="w-full bg-transparent border-0 p-0 font-label text-label text-text-primary focus:ring-0" readonly="" type="text" value="05:40"/>
</div>
</div>
</section>
<!-- Notes Input Card -->
<section class="flex flex-col gap-1.5">
<label class="font-caption text-caption font-medium text-text-secondary" for="record-notes">Milking observation</label>
<textarea class="w-full bg-surface border border-borderStrong rounded-xl p-3 font-body text-label text-text-primary placeholder:text-text-tertiary shadow-sm focus:border-accent focus:ring-2 focus:ring-accent resize-none outline-none" id="record-notes" placeholder="Optional notes (e.g. slight kick during milking, mastitis check clean)..." rows="3"></textarea>
</section>
</main>
<!-- Sticky Bottom Action Bar (No Tab Bar per strict semantic shell rules) -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[393px] bg-surface/95 backdrop-blur-md px-margin pt-3 pb-6 border-t border-border/50 shadow-2xl flex flex-col items-center gap-2.5 z-50">
<button class="w-full h-[52px] bg-accentFill active:bg-accentPressed text-on-primary rounded-full font-label text-label flex items-center justify-center gap-2 font-medium tracking-wide shadow-md active:scale-[0.98] transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
<span>Save record</span>
</button>
<!-- Offline Telemetry Status Badge -->
<div class="flex items-center gap-1.5 text-text-tertiary font-caption text-caption">
<span class="w-2 h-2 rounded-full bg-supportStrong inline-block"></span>
<span>Saved locally on device</span>
</div>
</div>
</div>
</body></html>
